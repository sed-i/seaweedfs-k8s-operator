# This file configures Charmcraft.
# See https://juju.is/docs/sdk/charmcraft-config for guidance.

# (Required)
name: seaweedfs-k8s

# (Required)
type: charm
assumes:
  - k8s-api
  - juju >= 3.6

# (Recommended)
title: SeaweedFS

links:
  website: https://github.com/sed-i/seaweedfs-k8s-operator
  source: https://github.com/sed-i/seaweedfs-k8s-operator
  issues: https://github.com/sed-i/seaweedfs-k8s-operator/issues

# (Required)
summary: A scalable S3-compatible object store powered by SeaweedFS.

# (Required)
description: |
  A lightweight, trivially scalable S3-compatible object store built on SeaweedFS.
  Drop-in replacement for MinIO or Ceph RADOS Gateway, suitable for both testing
  and home-lab production use.

  ## Features
  - **S3-compatible API** for drop-in object storage
  - **Auto-scaling cluster** — add units and they automatically form a storage cluster
  - **Auto-configured** — credentials are generated automatically, no manual setup needed
  - **Per-relation isolation** — each related application gets its own bucket and credentials
  - **Observability** — built-in Prometheus metrics and Grafana dashboard
  - **Lightweight** — single binary, minimal resource footprint

  ## Usage
  ```bash
  juju deploy seaweedfs-k8s --channel edge
  juju relate seaweedfs-k8s:s3-credentials your-app:s3
  juju relate seaweedfs-k8s:metrics-endpoint prometheus:metrics-endpoint
  juju relate seaweedfs-k8s:grafana-dashboard grafana:grafana-dashboard

  # Scale the cluster:
  juju add-unit seaweedfs-k8s -n 2
  ```

  ## Relation data
  For a related charm, relation data looks like this:
  ```yaml
    - relation-id: 7
      endpoint: s3
      related-endpoint: s3-credentials
      application-data:
        access-key: AKIAIOSFODNN7EXAMPLE
        bucket: s3-credentials-7
        endpoint: http://seaweedfs-k8s.my-model.svc.cluster.local:8333
        secret-key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
  ```

  ## Manual S3 access
  To access S3 directly:
  ```bash
  juju run seaweedfs-k8s/leader get-admin-credentials
  # Then use the returned credentials with s3cmd, awscli, or any S3 client
  s3cmd --host=<unit>:8333 --access_key=<key> --secret_key=<secret> --no-ssl ls
  ```

# (Required for 'charm' type)
platforms:
  ubuntu@24.04:amd64:

parts:
  charm:
    source: .
    plugin: uv
    build-packages: [git]
    build-snaps: [astral-uv]
    override-build: |
      craftctl default
      git describe --always > $CRAFT_PART_INSTALL/version

# (Optional) Configuration options for the charm
config:
  options:
    volume-size-limit-mb:
      type: int
      default: 1024
      description: |
        Maximum size in MB for each volume. When a volume reaches this limit,
        a new volume is created automatically.

    replication:
      type: string
      default: "001"
      description: |
        Data replication strategy. "000" means no replication (single copy),
        "001" means one additional copy on a different rack.
        See SeaweedFS replication docs for all options.

    filer-max-mb:
      type: int
      default: 64
      description: |
        Maximum size in MB for the filer metadata store.

    metrics:
      type: boolean
      default: true
      description: |
        Enable Prometheus metrics endpoint on port 9321.

    admin-access-key:
      type: string
      default: ""
      description: |
        Custom admin access key for S3. If left empty, a secure random key
        is generated automatically. Retrieve with `get-admin-credentials` action.

    admin-secret-key:
      type: string
      default: ""
      description: |
        Custom admin secret key for S3. If left empty, a secure random key
        is generated automatically. Retrieve with `get-admin-credentials` action.

# Containers and resources
containers:
  seaweedfs:
    resource: seaweedfs-image

    mounts:
      - storage: data
        location: /data

storage:
  data:
    type: filesystem
    description: >
      Storage directory for SeaweedFS volume and filer data.

resources:
  seaweedfs-image:
    type: oci-image
    description: OCI image for the 'seaweedfs' container
    upstream-source: chrislusf/seaweedfs:3.97

# Peer relation for cluster formation
peers:
  seaweedfs-peers:
    interface: seaweedfs_peers

# Provides relations
provides:
  s3-credentials:
    interface: s3

  metrics-endpoint:
    interface: prometheus_scrape

  grafana-dashboard:
    interface: grafana_dashboard

# Actions
actions:
  get-admin-credentials:
    description: |
      Return the admin S3 credentials (access key and secret key).
      Use these to access S3 directly with s3cmd, awscli, or any S3 client.
    params: {}