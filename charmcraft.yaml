# This file configures Charmcraft.
# See https://juju.is/docs/sdk/charmcraft-config for guidance.

# (Required)
name: seaweedfs-k8s

# (Required)
type: charm
assumes:
  - k8s-api
  - juju >= 3.6

# (Recommended)
title: SeaweedFS

links:
  website: https://github.com/sed-i/seaweedfs-k8s-operator
  source: https://github.com/sed-i/seaweedfs-k8s-operator
  issues: https://github.com/sed-i/seaweedfs-k8s-operator/issues

# (Required)
summary: Scalable S3-compatible object storage powered by SeaweedFS.

# (Required)
description: |
  ## Purpose
  This charm provides S3-compatible object storage backed by
  [SeaweedFS](https://github.com/seaweedfs/seaweedfs). It can be used as a
  lightweight `s3-integrator` replacement in tests, and as real object storage
  for small deployments and home labs, standing in for MinIO or Ceph RADOS
  Gateway.

  ## Scaling
  The charm forms a single storage cluster from every unit in the application.
  Adding a unit (`juju add-unit seaweedfs-k8s`) adds a volume server and an S3
  gateway that join automatically; no manual peer or endpoint configuration is
  required. The first unit runs the cluster master and filer.

  ## Credentials
  S3 credentials are generated on first start and exposed through the
  `s3-credentials` relation together with the bucket and endpoint. Bucket names
  are derived from the relation id, so a single SeaweedFS application can serve
  several consumers at once without extra configuration.

# (Required for 'charm' type)
platforms:
  ubuntu@24.04:amd64:

parts:
  charm:
    source: .
    plugin: uv
    build-packages: [git]
    build-snaps: [astral-uv]
    override-build: |
      craftctl default
      git describe --always > $CRAFT_PART_INSTALL/version

# (Optional) Configuration options for the charm
# This config section defines charm config options, and populates the Configure
# tab on Charmhub.
# More information on this format at https://juju.is/docs/sdk/charmcraft-yaml#heading--config
# General configuration documentation: https://juju.is/docs/sdk/config
config:
  options:
    bucket:
      type: string
      default: "default-bucket"
      description: |
        An additional bucket to create on startup. Consumers that relate to the
        charm get their own bucket derived from the relation id, so this is only
        needed if you want a bucket that is not tied to a relation.
    replication:
      type: string
      default: "001"
      description: |
        SeaweedFS replication placement for data volumes, as an XYZ string:
        X replicas in other data centers, Y in other racks, Z in other servers
        in the same rack. The default ("001") keeps one extra copy on another
        volume server in the same rack. A single-unit deployment always uses
        "000", because there is nowhere to place a replica.

# The containers and resources metadata apply to Kubernetes charms only.
# See https://juju.is/docs/sdk/metadata-reference for a checklist and guidance.

# Your workload's containers.
containers:
  seaweedfs:
    resource: seaweedfs-image

    mounts:
      - storage: data
        location: /data

storage:
  data:
    type: filesystem
    description: >
      Storage dir for seaweedfs data, such as s3.

# This field populates the Resources tab on Charmhub.
resources:
  # An OCI image resource for each container listed above.
  # You may remove this if your charm will run without a workload sidecar container.
  seaweedfs-image:
    type: oci-image
    description: OCI image for the 'seaweedfs' container
    # The upstream-source field is ignored by Juju. It is included here as a reference
    # so the integration testing suite knows which image to deploy during testing. This field
    # is also used by the 'canonical/charming-actions' Github action for automated releasing.
    upstream-source: chrislusf/seaweedfs:3.97

peers:
  cluster:
    interface: seaweedfs-cluster

provides:
  s3-credentials:
    interface: s3
