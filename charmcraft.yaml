# This file configures Charmcraft.
# See https://juju.is/docs/sdk/charmcraft-config for guidance.

# (Required)
name: seaweedfs-k8s

# (Required)
type: charm
assumes:
  - k8s-api
  - juju >= 3.6

# (Recommended)
title: SeaweedFS

links:
  website: https://github.com/sed-i/seaweedfs-k8s-operator
  source: https://github.com/sed-i/seaweedfs-k8s-operator
  issues: https://github.com/sed-i/seaweedfs-k8s-operator/issues

# (Required)
summary: A drop-in S3-compatible object store, replacing ceph/radosgw and minio.

# (Required)
description: |
  A Juju sidecar charm that deploys SeaweedFS as a drop-in S3-compatible
  object store. It replaces ceph/radosgw and minio in Juju-based
  deployments. Designed for zero-config deployment: `juju deploy
  seaweedfs-k8s` gives a working S3 endpoint. Supports horizontal scaling
  via a peer mesh (every unit serves S3/volume/filer; up to 3 units run
  Raft masters).

# (Required for 'charm' type)
platforms:
  ubuntu@24.04:amd64:

parts:
  charm:
    source: .
    plugin: uv
    build-packages: [git]
    build-snaps: [astral-uv]
    override-build: |
      craftctl default
      git describe --always > $CRAFT_PART_INSTALL/version

# (Optional) Configuration options for the charm
config:
  options:
    replication:
      type: string
      default: ""
      description: |
        SeaweedFS default replication (xyz: x=copies in other DCs, y=other
        racks, z=other servers in the same rack). Empty means auto: `000`
        with 1 unit, `001` with 2 or more units. Any explicit value
        overrides auto.
    volume-size-limit-mb:
      type: int
      default: 1024
      description: Max volume file size in MB.

# The containers and resources metadata apply to Kubernetes charms only.
containers:
  seaweedfs:
    resource: seaweedfs-image
    mounts:
      - storage: data
        location: /data

storage:
  data:
    type: filesystem
    description: Volume data storage for SeaweedFS (single PVC per unit).
    minimum-size: 10G

resources:
  seaweedfs-image:
    type: oci-image
    description: OCI image for the 'seaweedfs' container
    # The upstream-source field is ignored by Juju. It is included here as a
    # reference so the integration testing suite knows which image to deploy
    # during testing, and is used by canonical/charming-actions for releases.
    # Pinned by digest; bumped with charm releases.
    upstream-source: chrislusf/seaweedfs:3.97@sha256:bb05d66d2963b1cc48073190781c3dd29e2c4c88a2ae2986bf58e38c86d89c6e

peers:
  seaweedfs-peers:
    interface: seaweedfs-peers

provides:
  s3-credentials:
    interface: s3

requires:
  certificates:
    interface: tls-certificates
    limit: 1
    optional: true
  ingress:
    interface: ingress
    limit: 1
    optional: true

actions:
  get-admin-credentials:
    description: Retrieve the current admin S3 access/secret keys.
  rotate-admin-credentials:
    description: >
      Generate new admin credentials and re-sync identities to the filer
      (hot reload, no restart).
  rotate-relation-credentials:
    description: >
      Regenerate credentials for one s3-credentials relation; updates the
      secret, the relation data, and re-syncs identities.
    params:
      relation-id:
        type: integer
        description: The id of the s3-credentials relation to rotate.
    required: [relation-id]
  pre-upgrade-check:
    description: >
      Verify cluster health (Raft leader present, all masters up) before
      `juju refresh`.
